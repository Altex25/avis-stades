spring.config.import=optional:file:../infra/.env[.properties],optional:file:infra/.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.mail.host=localhost
spring.mail.port=${MAILPIT_SMTP_PORT}

app.storage.s3.endpoint=http://localhost:${GARAGE_S3_PORT}
app.storage.s3.region=garage
app.storage.s3.bucket=${S3_BUCKET}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.path-style-access=true
