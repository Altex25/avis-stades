name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-build
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco/jacoco.xml
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: imresamu/postgis:17-3.6-alpine
        env:
          POSTGRES_DB: avis_stades
          POSTGRES_USER: avis_stades
          POSTGRES_PASSWORD: smoke-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avis_stades -d avis_stades"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build the single deployable
        working-directory: backend
        run: ./mvnw -B -Pfrontend -DskipTests package
      - name: Start the application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/avis_stades
          SPRING_DATASOURCE_USERNAME: avis_stades
          SPRING_DATASOURCE_PASSWORD: smoke-test-only
        run: |
          nohup java -jar backend/target/avis-stades.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8080/avis-stades/actuator/health/readiness && exit 0
            sleep 2
          done
          cat app.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the smoke test
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-report
          path: |
            frontend/playwright-report
            frontend/test-results
            app.log
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-build
          path: backend/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
      - if: env.SONAR_TOKEN == '' && github.actor != 'dependabot[bot]'
        run: |
          echo "::error::The SONAR_TOKEN secret is missing."
          exit 1
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
