name: PR title

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR/$HEAD_REF" in
            dependabot\[bot\]/* | */release-please--* | */develop | */release/*)
              echo "Automated or release pull request: issue number not required."
              pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].*$' ;;
            *)
              pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].* \(#[0-9]+\)$' ;;
          esac
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "Title OK: $TITLE"
          else
            echo "::error::The title must be a one-line Conventional Commit ending with the issue number, for example 'feat: submit a review (#15)'. Got: $TITLE"
            exit 1
          fi
