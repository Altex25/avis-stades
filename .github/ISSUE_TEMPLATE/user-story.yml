name: User story
description: Besoin exprimé par une persona
title: "USxx · "
labels: ["type: user story"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      value: En tant que **…**, je veux **…** afin de **…**.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      value: |
        - [ ] **CA1** Étant donné …, quand …, alors …
    validations:
      required: true
  - type: textarea
    id: transverse
    attributes:
      label: Exigences transverses
      value: |
        - **Sécurité** :
        - **Accessibilité** :
  - type: textarea
    id: done
    attributes:
      label: Définition de terminé
      value: |
        - [ ] Pull request relue, pipeline vert, porte qualité SonarQube Cloud verte
        - [ ] Tests unitaires et d'intégration des règles métier, couverture du code nouveau d'au moins 80 %
        - [ ] Chaque critère CAn a son scénario de recette, exécuté en recette
        - [ ] Parcours vérifié au clavier, aucune violation axe grave ou critique
        - [ ] Fusionné en squash dans `develop` et déployé en recette
  - type: dropdown
    id: moscow
    attributes:
      label: Priorité
      options: [Must, Should, Could]
    validations:
      required: true
  - type: input
    id: landmarks
    attributes:
      label: Repères
      placeholder: "Persona : … · Module : … · Charge estimée : … j · Compétences : …"
