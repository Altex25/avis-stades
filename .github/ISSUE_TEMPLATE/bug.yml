name: Bug
description: Bogue constaté en recette ou en production
title: "Bug · "
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
      description: Message d'erreur, capture, extrait de journal
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options: [Recette, Production, Local]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 140, Android 16
  - type: dropdown
    id: priority
    attributes:
      label: Priorité
      options:
        - P1 critique — service indisponible ou atteinte aux données
        - P2 majeur — fonction clé indisponible
        - P3 mineur — anomalie contournable
        - P4 cosmétique — gêne visuelle sans impact
    validations:
      required: true
